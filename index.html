<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>YAH MELODY MP3 Player Pro</title>
    <link rel="icon" type="image/png" href="https://via.placeholder.com/32">

    <!-- AdSense Global Script -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1987206835125334"
        crossorigin="anonymous"></script>

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #eceff1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px;
        }
        .player-container {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 400px;
        }
        .controls-row {
            margin: 15px 0;
            display: flex;
            justify-content: space-between;
            gap: 5px;
        }
        button {
            flex: 1;
            padding: 8px;
            cursor: pointer;
            border: 1px solid #ddd;
            border-radius: 4px;
            background: #fff;
        }
        button.active {
            background: #007bff;
            color: white;
        }
        #playlist {
            list-style: none;
            padding: 0;
            margin-top: 20px;
            max-height: 200px;
            overflow-y: auto;
            border-top: 1px solid #eee;
        }
        #playlist li {
            padding: 12px;
            border-bottom: 1px solid #f9f9f9;
            cursor: pointer;
            font-size: 14px;
        }
        #playlist li.playing {
            background: #e3f2fd;
            color: #007bff;
            font-weight: bold;
        }
        .adsense-container {
            margin-top: 20px;
        }
    </style>
</head>
<body>

<div class="player-container">
    <h3>🎵 YAH MELODY PLAYER</h3>
    <p style="font-size:12px;color:#666;">Enjoy good music by YAH-MELODY while you also build and enjoy your play list🎧</p>

    <input type="file" id="fileInput" accept="audio/mp3" multiple style="width: 100%; margin-bottom: 15px;">

    <audio id="audioPlayer" controls style="width: 100%;"></audio>

    <div class="controls-row">
        <button id="btnRepeatNone" class="active">No Repeat</button>
        <button id="btnRepeatOne">Repeat Single</button>
        <button id="btnRepeatAll">Repeat Playlist</button>
    </div>

    <div id="status" style="font-size: 13px; color: #555; margin: 10px 0;">
        Loading songs from YAH-MELODY...
    </div>

    <ul id="playlist"></ul>

    <!-- AdSense Unit -->
    <div class="adsense-container">
        <ins class="adsbygoogle"
             style="display:block"
             data-ad-client="ca-pub-1987206835125334"
             data-ad-slot="7395131675"
             data-ad-format="auto"
             data-full-width-responsive="true"></ins>
        <script>
            (adsbygoogle = window.adsbygoogle || []).push({});
        </script>
    </div>
</div>

<script>
    const audioPlayer = document.getElementById('audioPlayer');
    const fileInput = document.getElementById('fileInput');
    const playlistUI = document.getElementById('playlist');
    const statusText = document.getElementById('status');

    let playlist = [];
    let currentIndex = 0;
    let repeatMode = 'none';

    // 🔥 CONFIGURE YOUR GITHUB DETAILS
    const GITHUB_OWNER = "yahmelody247-max";
    const GITHUB_REPO = "yah-melody-player";
    const GITHUB_FOLDER = "music";

    async function loadGitHubMP3s() {
        const apiUrl = `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${GITHUB_FOLDER}`;

        try {
            const response = await fetch(apiUrl);
            const data = await response.json();

            const mp3Files = data.filter(file => file.name.endsWith('.mp3'));

            mp3Files.forEach(file => {
                playlist.push({
                    name: file.name,
                    url: file.download_url
                });
            });

            if (playlist.length === 0) {
                statusText.textContent = "No MP3 files found in GitHub folder.";
                return;
            }

            renderPlaylist();
            loadTrack(0);

        } catch (error) {
            console.error(error);
            statusText.textContent = "Error loading songs from GitHub.";
        }
    }

    fileInput.addEventListener('change', (e) => {
        const files = Array.from(e.target.files);
        files.forEach(file => {
            playlist.push({
                name: file.name,
                url: URL.createObjectURL(file)
            });
        });
        renderPlaylist();
    });

    function renderPlaylist() {
        playlistUI.innerHTML = '';
        playlist.forEach((track, index) => {
            const li = document.createElement('li');
            li.textContent = `${index + 1}. ${track.name}`;
            if (index === currentIndex) li.className = 'playing';

            li.onclick = () => {
                currentIndex = index;
                loadTrack(index);
                audioPlayer.play();
            };

            playlistUI.appendChild(li);
        });
    }

    function loadTrack(index) {
        currentIndex = index;
        audioPlayer.src = playlist[index].url;
        statusText.textContent = "Now Playing: " + playlist[index].name;
        renderPlaylist();
    }

    audioPlayer.addEventListener('ended', () => {
        if (repeatMode === 'one') {
            audioPlayer.play();
        } else if (repeatMode === 'all') {
            currentIndex = (currentIndex + 1) % playlist.length;
            loadTrack(currentIndex);
            audioPlayer.play();
        } else {
            if (currentIndex < playlist.length - 1) {
                currentIndex++;
                loadTrack(currentIndex);
                audioPlayer.play();
            }
        }
    });

    const btns = {
        none: document.getElementById('btnRepeatNone'),
        one: document.getElementById('btnRepeatOne'),
        all: document.getElementById('btnRepeatAll')
    };

    function setRepeat(mode) {
        repeatMode = mode;
        Object.values(btns).forEach(b => b.classList.remove('active'));
        btns[mode].classList.add('active');
    }

    btns.none.onclick = () => setRepeat('none');
    btns.one.onclick = () => setRepeat('one');
    btns.all.onclick = () => setRepeat('all');

    // 🚀 AUTO LOAD
    loadGitHubMP3s();
</script>

</body>
</html>
